name: .NET

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.400"

      - name: Restore and audit dependencies
        run: >
          dotnet restore SirBilling.slnx
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:TreatWarningsAsErrors=true

      - name: Build
        run: >
          dotnet build SirBilling.slnx
          --configuration Release
          --no-restore
          --warnaserror

      - name: Test
        run: >
          dotnet test SirBilling.slnx
          --configuration Release
          --no-build
          --verbosity normal
